# /etc/nginx/sites-available/scraper (lien dans sites-enabled)
# Même modèle que le site api-market : ce bloc en HTTP, puis
#   certbot --nginx -d scraper.ste-scpb.com
# ajoute le certificat et la redirection vers HTTPS.

limit_req_zone $binary_remote_addr zone=scpb_scraper:10m rate=10r/s;

server {
    listen 80;
    server_name scraper.ste-scpb.com;

    client_max_body_size 1m;

    location / {
        limit_req zone=scpb_scraper burst=30 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
